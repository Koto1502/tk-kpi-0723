<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Knight Fall — KPI Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface-0:#f4f3f1; --surface-1:#fcfcfb; --border:#e4e2dd;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#807e78;
    --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
    --series-5:#e87ba4; --series-6:#008300; --series-7:#4a3aa7; --series-8:#e34948;
    --grid:#eceae6; --tooltip-bg:#0b0b0b; --tooltip-fg:#ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0:#111110; --surface-1:#1a1a19; --border:#33322f;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8d85;
      --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
      --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
      --grid:#262623; --tooltip-bg:#fcfcfb; --tooltip-fg:#0b0b0b;
    }
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--surface-0); color:var(--text-primary);
         font:14px/1.45 "Segoe UI",system-ui,sans-serif; padding:20px; }
  h1 { font-size:20px; font-weight:650; }
  .sub { color:var(--text-secondary); font-size:12.5px; margin:4px 0 18px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .tile { background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .tile .v { font-size:24px; font-weight:650; letter-spacing:-0.02em; }
  .tile .l { font-size:11.5px; color:var(--text-secondary); margin-top:2px; }
  .tile .n { font-size:10.5px; color:var(--text-muted); margin-top:3px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(430px,1fr)); gap:14px; }
  .card { background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:14px 16px 10px; overflow:hidden; }
  .card.wide { grid-column:1 / -1; }
  .card h2 { font-size:13.5px; font-weight:650; }
  .card .note { font-size:11px; color:var(--text-muted); margin:2px 0 6px; }
  .legend { display:flex; flex-wrap:wrap; gap:12px; font-size:11.5px; color:var(--text-secondary); margin:4px 0 2px; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .sw { width:10px; height:10px; border-radius:3px; display:inline-block; }
  svg { display:block; width:100%; }
  svg text { font:10.5px "Segoe UI",system-ui,sans-serif; fill:var(--text-secondary); }
  svg .dl { font-weight:600; fill:var(--text-primary); }
  .gridline { stroke:var(--grid); stroke-width:1; }
  .axis { stroke:var(--border); stroke-width:1; }
  #tip { position:fixed; pointer-events:none; background:var(--tooltip-bg); color:var(--tooltip-fg);
         padding:6px 9px; border-radius:7px; font-size:11.5px; line-height:1.5; opacity:0;
         transition:opacity .08s; z-index:10; max-width:260px; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th { text-align:right; color:var(--text-secondary); font-weight:600; padding:4px 8px; border-bottom:1px solid var(--border); }
  th:first-child, td:first-child { text-align:left; }
  td { text-align:right; padding:3px 8px; font-variant-numeric:tabular-nums; }
  td.heat { border-radius:4px; }
  .caveats { margin-top:16px; font-size:11.5px; color:var(--text-muted); max-width:1100px; }
  .caveats b { color:var(--text-secondary); }

  /* ---- global filter bar ---- */
  .filters { position:sticky; top:0; z-index:9; background:var(--surface-0);
    border-bottom:1px solid var(--border); padding:9px 0 11px; margin:0 0 14px;
    display:flex; flex-wrap:wrap; gap:9px; align-items:center; }
  .ms { position:relative; }
  .ms > button { background:var(--surface-1); border:1px solid var(--border); color:var(--text-primary);
    border-radius:8px; padding:7px 11px; font:inherit; font-size:12px; cursor:pointer;
    display:flex; gap:7px; align-items:center; }
  .ms > button:hover { border-color:var(--text-muted); }
  .ms .cnt { background:var(--series-1); color:#fff; border-radius:20px; padding:0 6px;
    font-size:10.5px; font-weight:650; }
  .ms .dim { color:var(--text-muted); }
  .ms .panel { display:none; position:absolute; top:calc(100% + 5px); left:0; width:300px;
    max-height:340px; overflow:auto; background:var(--surface-1); border:1px solid var(--border);
    border-radius:9px; box-shadow:0 6px 22px rgba(0,0,0,.22); padding:8px; }
  .ms.open .panel { display:block; }
  .ms .panel input[type=search] { width:100%; padding:6px 8px; margin-bottom:5px; font:inherit;
    font-size:12px; border:1px solid var(--border); border-radius:6px;
    background:var(--surface-0); color:var(--text-primary); }
  .ms .opt { display:flex; align-items:center; gap:7px; padding:4px 5px; border-radius:5px;
    cursor:pointer; font-size:12px; }
  .ms .opt:hover { background:var(--surface-0); }
  .ms .opt .n { margin-left:auto; color:var(--text-muted); font-size:11px; font-variant-numeric:tabular-nums; }
  .ms .acts { display:flex; gap:10px; padding:1px 5px 6px; }
  .ms .acts a { color:var(--series-1); font-size:11.5px; cursor:pointer; }
  .fstat { font-size:11.5px; color:var(--text-secondary); margin-left:auto; }
  .fstat b { color:var(--text-primary); }
  .btn { background:var(--surface-1); border:1px solid var(--border); color:var(--text-primary);
    border-radius:8px; padding:7px 11px; font:inherit; font-size:12px; cursor:pointer; }
  .btn:hover { border-color:var(--text-muted); }
  .badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 6px; border-radius:20px;
    background:var(--surface-0); border:1px solid var(--border); color:var(--text-muted);
    margin-left:6px; vertical-align:middle; }
  .ctrls { display:flex; flex-wrap:wrap; gap:11px; align-items:center; margin:2px 0 9px;
    font-size:12px; color:var(--text-secondary); }
  .ctrls label { display:inline-flex; gap:5px; align-items:center; cursor:pointer; }
  select.vsel { background:var(--surface-1); border:1px solid var(--border); color:var(--text-primary);
    border-radius:7px; padding:5px 8px; font:inherit; font-size:12px; }
  th.grp { text-align:center; font-size:11.5px; padding-bottom:2px; }
  td.na, th.na { color:var(--text-muted); }
  .vA { color:var(--series-1); } .vB { color:var(--series-2); }
  .empty { padding:18px 4px; color:var(--text-muted); font-size:12.5px; }
</style>
</head>
<body>
<h1>Tiny Knight Fall — KPI Dashboard</h1>
<div class="sub" id="sub"></div>
<div class="filters" id="filters"></div>
<div class="tiles" id="tiles"></div>
<div class="grid" id="grid"></div>
<div class="caveats" id="caveats"></div>
<div id="tip"></div>

<script>
const DATA = /*__DATA__*/;

/* ---------- helpers ---------- */
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmtD = s => { const d = String(s).replaceAll('-',''); return d.slice(4,6).replace(/^0/,'') + '/' + d.slice(6,8).replace(/^0/,''); };
const fmt$ = v => '$' + (v>=100 ? v.toFixed(0) : v.toFixed(2));
const fmtK = v => v>=1000 ? (v/1000).toFixed(1).replace(/\.0$/,'')+'k' : String(Math.round(v));
const tip = document.getElementById('tip');
function showTip(html, ev){ tip.innerHTML = html; tip.style.opacity = 1;
  const pad = 14, w = tip.offsetWidth;
  tip.style.left = Math.min(ev.clientX + pad, innerWidth - w - 10) + 'px';
  tip.style.top  = (ev.clientY + pad) + 'px'; }
function hideTip(){ tip.style.opacity = 0; }

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

function card(title, note, opts={}){
  const c = document.createElement('div'); c.className = 'card' + (opts.wide?' wide':'');
  c.innerHTML = `<h2>${title}</h2><div class="note">${note}</div>`;
  document.getElementById('grid').appendChild(c); return c;
}
function legend(c, items){
  const l = document.createElement('div'); l.className='legend';
  l.innerHTML = items.map(i=>`<span><span class="sw" style="background:${i.color}"></span>${i.name}</span>`).join('');
  c.appendChild(l);
}

/* Generic time chart: stacked bars + optional line overlays, one y axis. */
function timeChart(c, {dates, stacks=[], lines=[], h=230, yFmt=fmtK, tipRow}){
  const W = 860, P = {l:44, r:10, t:10, b:22};
  const svg = el('svg', {viewBox:`0 0 ${W} ${h}`}, c);
  const iw = W-P.l-P.r, ih = h-P.t-P.b, n = dates.length;
  const totals = dates.map((_,i)=> stacks.reduce((s,st)=>s+(st.values[i]||0),0));
  let max = Math.max(...totals, ...lines.flatMap(l=>l.values.filter(v=>v!=null)), 1);
  max *= 1.08;
  const y = v => P.t + ih - (v/max)*ih;
  const x = i => P.l + (i+0.5)*(iw/n);
  const bw = Math.min(22, iw/n - 4);
  const ticks = 4;
  for (let t=0;t<=ticks;t++){ const v = max*t/ticks, yy = y(v);
    el('line',{x1:P.l,x2:W-P.r,y1:yy,y2:yy,class:'gridline'},svg);
    el('text',{x:P.l-6,y:yy+3,'text-anchor':'end'},svg).textContent = yFmt(v);
  }
  el('line',{x1:P.l,x2:W-P.r,y1:y(0),y2:y(0),class:'axis'},svg);
  const step = Math.ceil(n/9);
  dates.forEach((d,i)=>{ if(i%step===0) el('text',{x:x(i),y:h-6,'text-anchor':'middle'},svg).textContent = fmtD(d); });
  // stacked bars with 2px gaps between segments
  dates.forEach((d,i)=>{ let acc = 0;
    stacks.forEach((st,si)=>{ const v = st.values[i]||0; if(v<=0){return;}
      const y1 = y(acc+v), y0 = y(acc);
      el('rect',{x:x(i)-bw/2, y:y1, width:bw, height:Math.max(0.5,y0-y1-(acc>0?2:0)),
        rx:3, fill:st.color},svg);
      acc += v; });
  });
  lines.forEach(ln=>{
    const pts = ln.values.map((v,i)=> v==null?null:[x(i),y(v)]).filter(Boolean);
    el('path',{d:'M'+pts.map(p=>p.join(',')).join('L'), fill:'none', stroke:ln.color,
      'stroke-width':2,'stroke-linejoin':'round'},svg);
    pts.forEach(p=> el('circle',{cx:p[0],cy:p[1],r:2.4,fill:ln.color},svg));
  });
  // hover columns
  dates.forEach((d,i)=>{
    const r = el('rect',{x:x(i)-iw/n/2, y:P.t, width:iw/n, height:ih, fill:'transparent'},svg);
    r.addEventListener('mousemove', ev=> showTip(tipRow(i), ev));
    r.addEventListener('mouseleave', hideTip);
  });
}

/* Horizontal bars */
function hbars(c, rows, {color, vFmt=fmtK, h=null, tipRow}){
  const W = 860, rh = 24, P = {l:210, r:56, t:4, b:4};
  const H = h || rows.length*rh + P.t + P.b;
  const svg = el('svg', {viewBox:`0 0 ${W} ${H}`}, c);
  const max = Math.max(...rows.map(r=>r.v), 1e-9);
  rows.forEach((r,i)=>{ const yy = P.t + i*rh;
    el('text',{x:P.l-8,y:yy+rh/2+3,'text-anchor':'end'},svg).textContent =
      r.name.length>30 ? r.name.slice(0,29)+'…' : r.name;
    const w = Math.max(2,(r.v/max)*(W-P.l-P.r));
    const bar = el('rect',{x:P.l,y:yy+4,width:w,height:rh-9,rx:3,fill:color},svg);
    el('text',{x:P.l+w+6,y:yy+rh/2+3,class:'dl'},svg).textContent = vFmt(r.v);
    if (tipRow){ bar.addEventListener('mousemove',ev=>showTip(tipRow(r),ev));
                 bar.addEventListener('mouseleave',hideTip); }
  });
}

/* ================= segment engine =================
   Every section below the filter bar is recomputed in the browser from two
   baked-in tables: one row per user (SEG.users) and one row per user-day-build
   (SEG.facts). So a filtered DAU is a genuine distinct-user count for the
   selected segment, not a total scaled down by a ratio. Revenue is carried as
   integer micro-USD in the payload and converted here. */
const SEG = DATA.seg, S_U = SEG.users, S_F = SEG.facts;
const NU = S_U.co.length, NF = S_F.u.length, NDAY = SEG.days.length;
const DAYS = SEG.days, VERS = SEG.versions, LASTDAY = NDAY - 1;
const MU = 1e-6;
const isoDay = s => String(s).replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3');
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
let NOWMIN = 0; for (let i=0;i<NU;i++) if (S_U.lt[i] > NOWMIN) NOWMIN = S_U.lt[i];

/* per-user active-day index (CSR). Independent of the filter, so built once. */
const UDoff = new Int32Array(NU+1);
for (let k=0;k<NF;k++) UDoff[S_F.u[k]+1]++;
for (let i=0;i<NU;i++) UDoff[i+1] += UDoff[i];
const UDday = new Int16Array(NF);
{ const cur = Int32Array.from(UDoff.subarray(0,NU));
  for (let k=0;k<NF;k++) UDday[cur[S_F.u[k]]++] = S_F.d[k]; }
function active(i, day){
  for (let k=UDoff[i]; k<UDoff[i+1]; k++) if (UDday[k]===day) return true;
  return false;
}

/* ---- filter state ---- */
const FIL = { co:new Set(), ca:new Set() };
/* version-comparison / swimlane controls, kept outside renderAll so the user's
   choices survive a filter change */
const VS = { a:null, b:null, hours:24,
             mets:new Set(['dau','inst','arpu','arppu','d1','d3','d7']) };
let MASK = new Uint8Array(NU), NSEL = 0;
function buildMask(){
  const useCo = FIL.co.size>0, useCa = FIL.ca.size>0;
  MASK = new Uint8Array(NU); NSEL = 0;
  for (let i=0;i<NU;i++){
    if (useCo && !FIL.co.has(S_U.co[i])) continue;
    if (useCa && !FIL.ca.has(S_U.ca[i])) continue;
    MASK[i] = 1; NSEL++;
  }
}

/* ---- rebuild every date-level aggregate for the current selection ---- */
let AGG = null;
function computeAgg(){
  const dau=new Int32Array(NDAY), newu=new Int32Array(NDAY), sess=new Int32Array(NDAY),
        imps=new Int32Array(NDAY), pay=new Int32Array(NDAY), adv=new Int32Array(NDAY),
        iap=new Float64Array(NDAY), iaa=new Float64Array(NDAY);
  const lD=new Int32Array(NU).fill(-1), lP=new Int32Array(NU).fill(-1), lA=new Int32Array(NU).fill(-1);
  const dv = new Map();
  for (let k=0;k<NF;k++){
    const u=S_F.u[k]; if (!MASK[u]) continue;
    const d=S_F.d[k], v=S_F.v[k];
    if (lD[u]!==d){ dau[d]++; lD[u]=d; }          // facts are sorted by (user, day)
    sess[d]+=S_F.sess[k]; imps[d]+=S_F.imp[k];
    iap[d]+=S_F.iap[k]; iaa[d]+=S_F.adr[k];
    if (S_F.iap[k]>0 && lP[u]!==d){ pay[d]++; lP[u]=d; }
    if (S_F.imp[k]>0 && lA[u]!==d){ adv[d]++; lA[u]=d; }
    if (v>=0){ const key=d*100+v; dv.set(key,(dv.get(key)||0)+1); }
  }
  const cU=new Int32Array(SEG.countries.length), cR=new Float64Array(SEG.countries.length);
  const coh=[]; for (let i=0;i<NDAY;i++) coh.push([]);
  for (let i=0;i<NU;i++){
    if (!MASK[i]) continue;
    cU[S_U.co[i]]++; cR[S_U.co[i]] += (S_U.iap[i]+S_U.adr[i])*MU;
    if (S_U.fo[i]){ newu[S_U.fd[i]]++; coh[S_U.fd[i]].push(i); }
  }
  const daily = DAYS.map((d,i)=>({d, dau:dau[i], new_users:newu[i], sessions:sess[i],
    iaa_rev:+(iaa[i]*MU).toFixed(4), iap_rev:+(iap[i]*MU).toFixed(2),
    impressions:imps[i], ad_viewers:adv[i], payers:pay[i]}));
  const retention = [];
  coh.forEach((us,d)=>{ if (!us.length) return;
    const r = {cohort:isoDay(DAYS[d]), size:us.length};
    [1,3,7,14].forEach(n=>{ let a=0; for (const i of us) if (active(i,d+n)) a++;
      r['d'+n] = +(100*a/us.length).toFixed(1); });
    retention.push(r); });
  const act=new Int32Array(21), elg=new Int32Array(21);
  coh.forEach((us,d)=>{ for (const i of us) for (let dd=0; dd<=20; dd++){
    if (d+dd>LASTDAY) break; elg[dd]++; if (active(i,d+dd)) act[dd]++; } });
  const ret_curve = Array.from({length:21},(_,dd)=>({dd, active:act[dd], eligible:elg[dd]}));
  const dau_version = [];
  dv.forEach((n,key)=> dau_version.push({d:DAYS[(key/100)|0], v:VERS[key%100], users:n}));
  dau_version.sort((a,b)=> a.d<b.d?-1 : a.d>b.d?1 : a.v-b.v);
  const geo = SEG.countries.map((n,i)=>({country:n, users:cU[i], rev:+cR[i].toFixed(2)}))
    .filter(r=>r.users>0).sort((a,b)=>b.users-a.users).slice(0,12);
  return {daily, retention, ret_curve, dau_version, geo};
}

/* ---- per-build daily metrics, for the version comparison ---- */
function versionDaily(v){
  const dau=new Int32Array(NDAY), pay=new Int32Array(NDAY), inst=new Int32Array(NDAY),
        iap=new Float64Array(NDAY), rev=new Float64Array(NDAY);
  const lD=new Int32Array(NU).fill(-1), lP=new Int32Array(NU).fill(-1);
  for (let k=0;k<NF;k++){
    if (S_F.v[k]!==v) continue;
    const u=S_F.u[k]; if (!MASK[u]) continue;
    const d=S_F.d[k];
    if (lD[u]!==d){ dau[d]++; lD[u]=d; }
    iap[d]+=S_F.iap[k]*MU; rev[d]+=(S_F.iap[k]+S_F.adr[k])*MU;
    if (S_F.iap[k]>0 && lP[u]!==d){ pay[d]++; lP[u]=d; }
  }
  // installs and retention are keyed on the build the user INSTALLED on
  const coh=[]; for (let i=0;i<NDAY;i++) coh.push([]);
  for (let i=0;i<NU;i++)
    if (MASK[i] && S_U.fo[i] && S_U.fv[i]===v){ inst[S_U.fd[i]]++; coh[S_U.fd[i]].push(i); }
  const ret = {};
  [1,3,7].forEach(n=>{ ret[n] = DAYS.map((_,d)=>{
    const us=coh[d]; if (!us.length || d+n>LASTDAY) return null;
    let a=0; for (const i of us) if (active(i,d+n)) a++;
    return 100*a/us.length; }); });
  return {dau, pay, inst, iap, rev, ret};
}

/* ---- swimlane rows: one lane per user, x measured from their own install ---- */
function laneSet(v, minHours, kind){
  const cut = NOWMIN - minHours*60, out = [];
  let n = 0;
  for (let i=0;i<NU;i++){
    if (!MASK[i] || S_U.fv[i]!==v || S_U.ft[i] > cut) continue;
    n++;
    if (kind==='life'){ out.push([0, (S_U.lt[i]-S_U.ft[i])/60]); }
    else if (S_U.frt[i] >= 0){ out.push([(S_U.frt[i]-S_U.ft[i])/60, (S_U.lrt[i]-S_U.ft[i])/60]); }
  }
  out.sort((a,b)=> (b[1]-b[0]) - (a[1]-a[0]) || b[1]-a[1]);
  return {lanes:out, n};                       // n = all eligible players (the denominator)
}

/* ---- multi-select control ---- */
const MS_RESET = [];
function multiSelect(host, label, names, cnts, sel, onChange){
  const wrap = document.createElement('div'); wrap.className = 'ms';
  wrap.innerHTML = `<button></button><div class="panel">
    <input type="search" placeholder="Search ${esc(label.toLowerCase())}…">
    <div class="acts"><a data-a="all">Select all shown</a><a data-a="none">Clear</a></div>
    <div class="list"></div></div>`;
  host.appendChild(wrap);
  const btn=wrap.querySelector('button'), panel=wrap.querySelector('.panel'),
        list=wrap.querySelector('.list'), search=wrap.querySelector('input');
  const order = names.map((_,i)=>i).sort((a,b)=> cnts[b]-cnts[a] || (names[a]<names[b]?-1:1));
  const paint = ()=>{ btn.innerHTML = esc(label) +
    (sel.size ? `<span class="cnt">${sel.size}</span>` : ` <span class="dim">all</span>`); };
  list.innerHTML = order.map(i =>
    `<label class="opt" data-i="${i}"><input type="checkbox" value="${i}"${sel.has(i)?' checked':''}>` +
    `<span>${esc(names[i])}</span><span class="n">${cnts[i].toLocaleString()}</span></label>`).join('');
  list.addEventListener('change', e=>{
    const i = +e.target.value;
    e.target.checked ? sel.add(i) : sel.delete(i);
    paint(); onChange(); });
  search.addEventListener('input', ()=>{ const q = search.value.toLowerCase();
    list.querySelectorAll('.opt').forEach(o=>{
      o.style.display = names[+o.dataset.i].toLowerCase().includes(q) ? '' : 'none'; }); });
  wrap.querySelector('.acts').addEventListener('click', e=>{
    const a = e.target.dataset.a; if (!a) return;
    list.querySelectorAll('.opt').forEach(o=>{
      if (o.style.display === 'none') return;
      const i = +o.dataset.i, box = o.querySelector('input');

const fmtDur = h => h>=48 ? (h/24).toFixed(1)+'d' : h>=1 ? h.toFixed(1)+'h' : (h*60).toFixed(0)+'m';

// Default to the two most RECENT builds that each took a real share of installs.

// whose lifetimes barely overlap, so almost every cell would be blank.)
if (VS.a === null){
  const ic = new Int32Array(VERS.length);
  let tot = 0;
  for (let i=0;i<NU;i++) if (S_U.fo[i] && S_U.fv[i]>=0){ ic[S_U.fv[i]]++; tot++; }
  const floor = Math.max(30, tot*0.01);
  let recent = [...ic.keys()].filter(i=>ic[i]>=floor);
  if (recent.length < 2) recent = [...ic.keys()].filter(i=>ic[i]>0);
  recent.sort((x,y)=>x-y);

{
const c = card('Build comparison — day by day',

  {k:'d1',    h:'D1',       f:(S,d)=> S.ret[1][d],                            fmt:v=>v.toFixed(1)+'%'},
  {k:'d3',    h:'D3',       f:(S,d)=> S.ret[3][d],                            fmt:v=>v.toFixed(1)+'%'},
  {k:'d7',    h:'D7',       f:(S,d)=> S.ret[7][d],                            fmt:v=>v.toFixed(1)+'%'},
];
const shown = METS.filter(m=>VS.mets.has(m.k));

const opts = sel => VERS.map((v,i)=>`<option value="${i}"${i===sel?' selected':''}>v${v}</option>`).join('');
const ctl = document.createElement('div'); ctl.className='ctrls';
ctl.innerHTML =
  `<label><span class="vA">■</span> Build A <select class="vsel" id="vselA">${opts(VS.a)}</select></label>` +
  `<label><span class="vB">■</span> Build B <select class="vsel" id="vselB">${opts(VS.b)}</select></label>` +
  `<span style="opacity:.6">|</span>` +
  METS.map(m=>`<label><input type="checkbox" data-m="${m.k}"${VS.mets.has(m.k)?' checked':''}>${m.h}</label>`).join('');
c.appendChild(ctl);

  e.target.checked ? VS.mets.add(e.target.dataset.m) : VS.mets.delete(e.target.dataset.m);
  renderAll(); });

if (!shown.length){
  c.insertAdjacentHTML('beforeend', `<div class="empty">Pick at least one metric.</div>`);
} else {
  const A = versionDaily(VS.a), B = versionDaily(VS.b);
  const rows = DAYS.map((_,d)=>d).filter(d =>
    A.dau[d] || B.dau[d] || A.inst[d] || B.inst[d]);

    c.insertAdjacentHTML('beforeend',
      `<div class="empty">No activity on ${vName(VS.a)} or ${vName(VS.b)} for this selection.</div>`);

    const cell = (S, other, d, m) => {

}

/* ---------- 12 & 13. Swimlanes ---------- */
function swimlane(c, series, {h=300, unit='h'}){
  const W=860, P={l:44,r:12,t:8,b:26};
  const svg = el('svg',{viewBox:`0 0 ${W} ${h}`}, c);
  const ih = h-P.t-P.b, iw = W-P.l-P.r;
  let xmax = 0;
  series.forEach(s=>s.lanes.forEach(l=>{ if (l[1]>xmax) xmax=l[1]; }));
  if (!(xmax>0)) xmax = 1;
  const x = v => P.l + Math.min(v,xmax)/xmax*iw;
  for (let t=0;t<=4;t++){
    const v = xmax*t/4, xx = x(v);
    el('line',{x1:xx,x2:xx,y1:P.t,y2:P.t+ih,class:'gridline'},svg);
    el('text',{x:xx,y:h-8,'text-anchor':'middle'},svg).textContent = fmtDur(v);
  }
  for (let t=0;t<=4;t++){
    const yy = P.t + ih*t/4;
    el('text',{x:P.l-6,y:yy+3,'text-anchor':'end'},svg).textContent = (t*25)+'%';
  }
  el('line',{x1:P.l,x2:P.l,y1:P.t,y2:P.t+ih,class:'axis'},svg);
  series.forEach(s=>{
    if (!s.n || !s.lanes.length) return;
    // Lanes occupy ranks 0..lanes.length-1 of s.n players; ranks past the end are
    // players with nothing to draw (never monetized), so the filled height itself
    // is the share of the build that has a lane. Walk the lanes we do have rather
    // than sampling ranks, or a thin band would mostly be missed.
    const L = s.lanes.length, stride = Math.max(1, Math.ceil(L/1200));
    const rh = Math.max(1, ih*stride/s.n);
    for (let r=0; r<L; r+=stride){
      const lane = s.lanes[r];
      el('rect',{x:x(lane[0]), y:P.t + ih*r/s.n, width:Math.max(1, x(lane[1])-x(lane[0])),
        height:rh, fill:s.color, opacity:0.5},svg);
    }
  });
  const hit = el('rect',{x:P.l,y:P.t,width:iw,height:ih,fill:'transparent'},svg);
  hit.addEventListener('mousemove', ev=>{
    const box = svg.getBoundingClientRect();
    const pct = Math.max(0, Math.min(0.999, ((ev.clientY-box.top)/box.height*h - P.t)/ih));
    showTip(series.map(s=>{
      if (!s.n) return `<b>${s.name}</b>: no players`;
      const lane = s.lanes[Math.floor(pct*s.n)];
      return `<b>${s.name}</b> — ${(100*pct).toFixed(0)}th pct of ${s.n.toLocaleString()}<br>` +
        (lane ? `lasted ${fmtDur(lane[1]-lane[0])}` + (lane[0]>0 ? ` · started +${fmtDur(lane[0])}` : '')
              : 'never monetized');
    }).join('<br>'), ev);
  });
  hit.addEventListener('mouseleave', hideTip);
}

{
const HOPTS = [0,6,12,24,48,72,168];
const mk = (c, kind) => {
  const ctl = document.createElement('div'); ctl.className='ctrls';
  ctl.innerHTML = `<label>Only players first seen at least
    <select class="vsel" id="hsel_${kind}">${HOPTS.map(o=>
      `<option value="${o}"${o===VS.hours?' selected':''}>${o===0?'0h (all)':o+'h'}</option>`).join('')}
    </select> ago</label>`;
  c.appendChild(ctl);
  ctl.querySelector('select').onchange = e => { VS.hours = +e.target.value; renderAll(); };
  const A = laneSet(VS.a, VS.hours, kind), B = laneSet(VS.b, VS.hours, kind);
  legend(c, [{name:`${vName(VS.a)} (${A.n.toLocaleString()} players)`, color:css('--series-1')},
             {name:`${vName(VS.b)} (${B.n.toLocaleString()} players)`, color:css('--series-2')}]);
  if (!A.n && !B.n){
    c.insertAdjacentHTML('beforeend', `<div class="empty">No players match this selection.</div>`);
    return;
  }
  swimlane(c, [{name:vName(VS.a), color:css('--series-1'), lanes:A.lanes, n:A.n},
               {name:vName(VS.b), color:css('--series-2'), lanes:B.lanes, n:B.n}], {});
};

mk(card('Lifetime swimlanes — ' + vName(VS.a) + ' vs ' + vName(VS.b),
  'One horizontal lane per player: from their first event (x=0) to their last. Players are sorted longest-lived first and stacked by ' +
  '<b>normalized rank</b> — the y axis is “top N% of this build’s players”, so two builds with very different player counts overlay directly. ' +
  'x is time since that player’s own install, not calendar time. The “at least X hours” cut drops players too new to have had a chance to churn.',
  {wide:true}), 'life');

mk(card('Revenue swimlanes — ' + vName(VS.a) + ' vs ' + vName(VS.b),
  'Same normalization, but each lane spans a player’s <b>first to last revenue event</b> (IAP or ad impression), measured from their install. ' +
  'Players who never earned revenue occupy their rank with no lane, so the filled height is the share of the build that ever monetized ' +
  'and the width is how long they kept monetizing.',
  {wide:true}), 'rev');
}

document.getElementById('caveats').innerHTML =
  `<b>Definitions & caveats.</b> Source: GA4/Firebase BigQuery export (streaming tables only; the export begins ${isoD(dates[0])} and ${monthDay(dates[dates.length-1])} is a partial day). ` +
  `Users = user_pseudo_id (device-scoped; player_id coverage is too low to use). ` +
  `IAA revenue uses ad_impression_MAX only — ad_impression and ad_impression_rocket are duplicate logs of the same impressions (~$80 each, not additive). ` +
  `IAP revenue = event_value_in_usd on in_app_purchase, which only started reporting with build 15 (~Jul 20); earlier real IAP revenue, if any, is not in BigQuery. ` +
  `Retention is day-N (active exactly N days after install), cohorted by first_open. All figures UTC. ` +
  `<b>Filters.</b> Country is the geo of the player's first event (IP-based, so it is a rough proxy). ` +
  `Campaign comes from the AppsFlyer install exports joined on appsflyer_id and is only known for ` +
  `${(100*SEG.users.ca.filter(i=>SEG.campaigns[i]!=='(unattributed)').length/NU).toFixed(0)}% of users — ` +
  `the rest sit in “(unattributed)”, so a campaign selection can never sum back to the app total. ` +
  `Cards marked “whole app” are event-level metrics with no user dimension and ignore the filters. ` +
  `In the build comparison, DAU/ARPU/ARPPU count activity on that build while Installs and D1/D3/D7 follow the build the player installed on.`;
}

refresh();
