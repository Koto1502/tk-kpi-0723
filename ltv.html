  const pts = b.curve.map((v,d)=> v==null?null:[x(d),y(v),d,v]).filter(Boolean);
  el('path',{d:'M'+pts.map(p=>p[0]+','+p[1]).join('L'),fill:'none',stroke:b.color,'stroke-width':2,'stroke-linejoin':'round'},svg);
  pts.forEach(p=>{ const dot=el('circle',{cx:p[0],cy:p[1],r:3,fill:b.color},svg);
    dot.addEventListener('mousemove',ev=>showTip(`<b>${b.name}</b><br>D${p[2]}: ${fmt$(p[3])} / install`,ev));
    dot.addEventListener('mouseleave',hideTip); });
  const last = pts[pts.length-1];
  if(last) el('text',{x:last[0]+6,y:last[1]+3,class:'dl'},svg).textContent = fmt$(last[3]);
});
}

/* ---------- 2. LTV to date per cohort, stacked IAP/IAA ---------- */
{
const c = card('LTV per install to date, by install day — the Jul 20 cliff',
 'Bars = cumulative revenue per install for each daily cohort, split IAP vs ads. The step at Jul 20 is when build 15 made purchases visible, not a real change in player quality.');
legend(c, [{name:'IAP',color:css('--series-1')},{name:'ads (IAA)',color:css('--series-2')}]);
const rows = cohortKeys.filter(c=>cohorts[c].size>=50);
const W=980,H=260,P={l:52,r:10,t:12,b:26};
const svg = el('svg',{viewBox:`0 0 ${W} ${H}`},c);
const vals = rows.map(k=>({k, iap:cohorts[k].iap/cohorts[k].size, iaa:cohorts[k].iaa/cohorts[k].size}));
const max = Math.max(...vals.map(v=>v.iap+v.iaa))*1.1;
const x = i=>P.l+(i+0.5)*(W-P.l-P.r)/rows.length, y = v=>P.t+(H-P.t-P.b)*(1-v/max);
for(let t=0;t<=4;t++){ const v=max*t/4, yy=y(v);
  el('line',{x1:P.l,x2:W-P.r,y1:yy,y2:yy,class:'gridline'},svg);
  el('text',{x:P.l-6,y:yy+3,'text-anchor':'end'},svg).textContent=fmt$(v); }
const bw = Math.min(26,(W-P.l-P.r)/rows.length-4);
vals.forEach((v,i)=>{
  if(i%2===0) el('text',{x:x(i),y:H-8,'text-anchor':'middle'},svg).textContent=fmtDm(v.k);
  const y1=y(v.iap), y0=y(0);
  el('rect',{x:x(i)-bw/2,y:y1,width:bw,height:Math.max(0,y0-y1),rx:3,fill:css('--series-1')},svg);
  const y2=y(v.iap+v.iaa);
  el('rect',{x:x(i)-bw/2,y:y2,width:bw,height:Math.max(0,y1-y2-(v.iap>0?2:0)),rx:3,fill:css('--series-2')},svg);
  const hit = el('rect',{x:x(i)-bw/2-2,y:P.t,width:bw+4,height:H-P.t-P.b,fill:'transparent'},svg);
  hit.addEventListener('mousemove',ev=>showTip(
    `<b>${v.k}</b> · ${cohorts[v.k].size} installs · ${ageOf(v.k)}d old<br>IAP: ${fmt$(v.iap)} /install<br>ads: ${fmt$(v.iaa)} /install<br>total: ${fmt$(v.iap+v.iaa)} /install`,ev));
  hit.addEventListener('mouseleave',hideTip);
});
}

/* ---------- 3. cohort table ---------- */
{
const c = card('Cohort LTV table', 'Cumulative revenue per install at day N after install (cohorts ≥50 installs). Blank = cohort not old enough. IAP is only visible for Jul 20+ cohorts.');
const ramp=['#cde2fb','#b7d3f6','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab'];
const rows = cohortKeys.filter(k=>cohorts[k].size>=50);
const maxLtv = Math.max(...rows.map(k=>(cohorts[k].iap+cohorts[k].iaa)/cohorts[k].size));
const cell = (k,dd)=>{
  if(ageOf(k)<dd) return '<td></td>';
  const v = cumTo(k,dd)/cohorts[k].size;
  const idx = Math.min(ramp.length-1, Math.floor(v/(maxLtv||1)*ramp.length));
  return `<td class="heat" style="background:${ramp[idx]};color:${idx>5?'#fff':'#0b0b0b'}">${fmt$(v)}</td>`; };
c.insertAdjacentHTML('beforeend',
 `<div style="overflow-x:auto"><table><tr><th>cohort</th><th>installs</th><th>age</th><th>D1</th><th>D3</th><th>D7</th><th>D14</th><th>to date</th><th>IAP $</th><th>ads $</th></tr>`+
 rows.map(k=>{ const co=cohorts[k];
   return `<tr><td>${k.slice(5)}</td><td>${co.size}</td><td>${ageOf(k)}d</td>${cell(k,1)}${cell(k,3)}${cell(k,7)}${cell(k,14)}`+
     `<td><b>${fmt$((co.iap+co.iaa)/co.size)}</b></td><td>${fmt$(co.iap)}</td><td>${fmt$(co.iaa)}</td></tr>`; }).join('')+
 `</table></div>`);
}

document.getElementById('caveats').innerHTML =
 `<b>Definitions & caveats.</b> LTV here = <i>observed</i> cumulative revenue per install (IAP event_value_in_usd + AppLovin MAX impression revenue), cohorted by first_open date, day boundaries UTC. ` +
 `<b>IAP is only measurable from build 15 (~Jul 20):</b> older builds never emit purchase events, so cohorts before Jul 20 show ads-only LTV — their true LTV is understated by an unknown amount (AppsFlyer af_purchase is the source of truth for the missing period). ` +
 `$14.43 of window revenue belongs to users with no first_open in the export (installed before Jun 29) and is excluded. ` +
 `All cohorts are young (≤25 days); these are LTV floors, not converged values. Last day is partial (intraday).`;
</script>
