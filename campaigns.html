const WEND=PAYLOAD.meta.window.split('->').pop().trim();
const DAYS=[0,1,2,3,4,5,6,7], HZ=60;
const $=id=>document.getElementById(id);
const fmt$=v=>'$'+(Math.abs(v)>=100?v.toFixed(0):Math.abs(v)>=1?v.toFixed(2):v.toFixed(3));
const ageOf=c=>Math.round((new Date(WEND)-new Date(c))/864e5);
const RAMP=['#cde2fb','#b7d3f6','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab'];
const NS='http://www.w3.org/2000/svg';
function elx(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
const cur=()=>PAYLOAD.data[$('camp').value].cohorts;
const mval=(m,metric)=>metric==='iap'?m.iap:metric==='iaa'?m.iaa:(m.iap+m.iaa);
function cumTo(c,N,metric){let s=0;for(let dd=0;dd<=N;dd++){const m=c.dd[dd];if(m)s+=mval(m,metric);}return s;}
function totRev(c,metric){let s=0;for(const dd in c.dd)s+=mval(c.dd[dd],metric);return s;}

function render(){
 const metric=$('metric').value, basis=$('basis').value, cohorts=cur();
 const scale=(v,s)=>basis==='per'?v/(s||1):v;
 const keys=Object.keys(cohorts).sort();
 let tI=0,tIap=0,tIaa=0,tCost=0;
 keys.forEach(k=>{const c=cohorts[k];tI+=c.size;tIap+=totRev(c,'iap');tIaa+=totRev(c,'iaa');tCost+=c.cost||0;});
 const tRev=tIap+tIaa, shown=metric==='iap'?tIap:metric==='iaa'?tIaa:tRev;
 $('tiles').innerHTML=[
  {v:tI.toLocaleString(),l:'Installs',n:$('camp').value},
  {v:fmt$(tI?shown/tI:0),l:'LTV/install (to date)',n:metric+' , floor'},
  {v:fmt$(tCost),l:'Spend',n:fmt$(tI?tCost/tI:0)+' eCPI'},
  {v:(tCost?(tRev/tCost).toFixed(2):'-')+'x',l:'ROAS to date',n:fmt$(tRev)+' rev / '+fmt$(tCost)+' cost'},
  {v:(tRev?Math.round(100*tIap/tRev):0)+'%',l:'IAP share',n:'IAP '+fmt$(tIap)+' / ads '+fmt$(tIaa)},
 ].map(t=>`<div class="tile"><div class="v">${t.v}</div><div class="l">${t.l}</div><div class="n">${t.n}</div></div>`).join('');
 const maxLtv=Math.max(1,...keys.map(k=>scale(totRev(cohorts[k],metric),cohorts[k].size)));
 const head='<tr><th>cohort</th><th>installs</th><th>age</th>'+DAYS.map(d=>`<th>D${d}</th>`).join('')
  +'<th>to date</th><th>IAP $</th><th>ads $</th><th>cost</th><th>ROAS</th></tr>';
 const body=keys.map(k=>{const c=cohorts[k],age=ageOf(k);
  const cells=DAYS.map(D=>{if(age<D)return '<td></td>';const v=scale(cumTo(c,D,metric),c.size);
    const i=Math.min(RAMP.length-1,Math.floor(v/maxLtv*RAMP.length));
    return `<td class="heat" style="background:${RAMP[i]};color:${i>5?'#fff':'#0b0b0b'}">${fmt$(v)}</td>`;}).join('');
  const td=scale(totRev(c,metric),c.size), roas=c.cost?(totRev(c,'total')/c.cost).toFixed(2)+'x':'-';
  return `<tr><td>${k.slice(5)}</td><td>${c.size.toLocaleString()}</td><td>${age}d</td>${cells}`
   +`<td><b>${fmt$(td)}</b></td><td>${fmt$(scale(totRev(c,'iap'),c.size))}</td><td>${fmt$(scale(totRev(c,'iaa'),c.size))}</td>`
   +`<td>${fmt$(scale(c.cost||0,c.size))}</td><td>${roas}</td></tr>`;}).join('');
 $('table').innerHTML=`<table>${head}${body}</table>`;
 $('tnote').textContent=`Campaign: ${$('camp').value} - metric: ${metric} - basis: ${basis==='per'?'per install':'total $'}. Blank = cohort too young (the triangle). cost/ROAS from AppsFlyer daily spend.`;
 renderProj(metric); renderRet();
}

}
function renderProj(metric){
 const basis=$('basis').value, cohorts=cur(), keys=Object.keys(cohorts);
 const pc=$('pcohort')?$('pcohort').value:'__all__';
 // observed cumulative per-install curve (monotonic by construction) + install base
 let cum=[], installs=0, label='';
 if(pc!=='__all__' && cohorts[pc]){
   const c=cohorts[pc]; installs=c.size; label='cohort '+pc.slice(5)+' ('+c.size+' installs)';
   for(let dd=0;dd<=ageOf(pc);dd++) cum.push(cumTo(c,dd,metric)/(c.size||1));   // one cohort = exact cumulative
 } else {
   installs=keys.reduce((s,k)=>s+cohorts[k].size,0); label='all cohorts blended ('+installs.toLocaleString()+' installs)';
   let run=0;                                                                    // cumulative sum of avg daily increment -> monotonic
   const maxAge=Math.max(0,...keys.map(ageOf));
   for(let dd=0;dd<=maxAge;dd++){let inc=0,sz=0;
     keys.forEach(k=>{if(ageOf(k)>=dd){const m=cohorts[k].dd[dd];if(m)inc+=mval(m,metric);sz+=cohorts[k].size;}});
     run+=sz>0?inc/sz:0; cum.push(run);}
 }
 const toBasis=v=>basis==='per'?v:v*installs;                                     // total = per-install x installs
 const obs=cum.map((v,dd)=>({d:dd,v:toBasis(v)}));
 const box=$('proj');box.innerHTML='';
 if(obs.length<3||obs[obs.length-1].v<=0){box.innerHTML='<div class="note">Not enough revenue in this selection to project.</div>';$('pnote').textContent='';$('plegend').innerHTML='';return;}
 // least-squares log fit y = a*ln(day+1) + b on the observed (monotonic) curve
 const P=obs.map(p=>({x:Math.log(p.d+1),y:p.v,d:p.d}));
 const n=P.length,sx=P.reduce((s,p)=>s+p.x,0),sy=P.reduce((s,p)=>s+p.y,0),
   sxx=P.reduce((s,p)=>s+p.x*p.x,0),sxy=P.reduce((s,p)=>s+p.x*p.y,0);
 const a=(n*sxy-sx*sy)/((n*sxx-sx*sx)||1), b=(sy-a*sx)/n, yhat=d=>a*Math.log(d+1)+b;
 const ybar=sy/n, ssTot=P.reduce((s,p)=>s+(p.y-ybar)**2,0), ssRes=P.reduce((s,p)=>s+(p.y-yhat(p.d))**2,0);
 const r2=ssTot?Math.max(0,1-ssRes/ssTot):0, lastObs=obs[obs.length-1];
 // projected tail: clamp to be non-decreasing and anchored at the last actual (LTV can't drop)
 const proj=[]; let prev=lastObs.v;
 for(let dd=lastObs.d;dd<=HZ;dd++){const v=Math.max(yhat(dd),prev); proj.push({d:dd,v}); prev=v;}
 const at=d=>{let p=lastObs.v; for(let x=lastObs.d;x<=d;x++)p=Math.max(yhat(x),p); return p;};
 const W=980,H=300,Pd={l:58,r:16,t:12,b:24}, ymax=(Math.max(proj[proj.length-1].v,lastObs.v)*1.08)||1;
 const X=d=>Pd.l+d/HZ*(W-Pd.l-Pd.r), Y=v=>Pd.t+(H-Pd.t-Pd.b)*(1-v/ymax);
 const svg=elx('svg',{viewBox:`0 0 ${W} ${H}`},box);
 for(let t=0;t<=4;t++){const v=ymax*t/4,yy=Y(v);elx('line',{x1:Pd.l,x2:W-Pd.r,y1:yy,y2:yy,stroke:'var(--grid)'},svg);
   elx('text',{x:Pd.l-6,y:yy+3,'text-anchor':'end'},svg).textContent=fmt$(v);}
 for(let dd=0;dd<=HZ;dd+=10)elx('text',{x:X(dd),y:H-6,'text-anchor':'middle'},svg).textContent='D'+dd;
 elx('rect',{x:X(lastObs.d),y:Pd.t,width:X(HZ)-X(lastObs.d),height:H-Pd.t-Pd.b,fill:'var(--proj)',opacity:0.06},svg);
 elx('line',{x1:X(lastObs.d),x2:X(lastObs.d),y1:Pd.t,y2:H-Pd.b,stroke:'var(--proj)','stroke-dasharray':'3 3',opacity:.6},svg);
 elx('text',{x:X(lastObs.d)+5,y:Pd.t+11,fill:'var(--proj)'},svg).textContent='observed | projected';
 let pp='';proj.forEach((p,i)=>pp+=(i?'L':'M')+X(p.d)+','+Y(p.v));
 elx('path',{d:pp,fill:'none',stroke:'var(--proj)','stroke-width':2,'stroke-dasharray':'6 4'},svg);
 let op='';obs.forEach((p,i)=>op+=(i?'L':'M')+X(p.d)+','+Y(p.v));
 elx('path',{d:op,fill:'none',stroke:'var(--series-1)','stroke-width':2.4},svg);
 obs.forEach(p=>elx('circle',{cx:X(p.d),cy:Y(p.v),r:2.2,fill:'var(--series-1)'},svg));
 [30,60].forEach(dd=>{if(dd<=HZ){const v=at(dd);elx('circle',{cx:X(dd),cy:Y(v),r:3,fill:'var(--proj)'},svg);
   elx('text',{x:X(dd),y:Y(v)-6,'text-anchor':'middle',fill:'var(--proj)'},svg).textContent='D'+dd+' '+fmt$(v);}});
 $('plegend').innerHTML='<span><span style="width:14px;height:2px;background:var(--series-1);display:inline-block"></span>observed (actual)</span>'
  +'<span><span style="width:14px;height:0;border-top:2px dashed var(--proj);display:inline-block"></span>log-curve projection (estimate)</span>';
 const unit=basis==='per'?' /install':' total';
 $('pnote').innerHTML='<b>'+label+'</b> - metric '+metric+' - '+(basis==='per'?'per install':'total $')+'. '
  +'Fit: <b>'+(basis==='per'?'LTV/install':'LTV')+' &asymp; '+a.toFixed(4)+'&middot;ln(day+1)'+(b>=0?'+':'')+b.toFixed(2)+'</b> on D0-D'+lastObs.d+' (R&sup2;='+r2.toFixed(2)+'). '
  +'<b>Solid = actual, dashed = estimate.</b> Projected: D30 '+fmt$(at(30))+', D60 '+fmt$(at(60))+unit+'. '
  +(pc==='__all__'?'Blended = cumulative sum of each day\'s average per-install revenue (so it only rises).':'Single cohort - exact cumulative to date.');
}

 const GRN='var(--series-3,#1baf7a)', W=980,H=260,Pd={l:44,r:16,t:12,b:24}, ymax=Math.max(20,...pts.map(p=>p.v))*1.1;

 for(let dd=0;dd<=HR;dd+=5)elx('text',{x:X(dd),y:H-6,'text-anchor':'middle'},svg).textContent='D'+dd;
 let op='';pts.forEach((p,i)=>op+=(i?'L':'M')+X(p.d)+','+Y(p.v));
 elx('path',{d:op,fill:'none',stroke:GRN,'stroke-width':2.4},svg);

 [1,7,14,30].forEach(dd=>{const p=pts.find(x=>x.d===dd);if(p){elx('circle',{cx:X(dd),cy:Y(p.v),r:3,fill:GRN},svg);

 const scale=(v,s)=>basis==='per'?v/(s||1):v;
 const cols=['cohort','installs','age',...DAYS.map(d=>'D'+d),'to_date','IAP','ads','cost','ROAS'];
 const lines=['# metric='+metric+' basis='+(basis==='per'?'per_install':'total_usd'),cols.join(',')];
 keys.forEach(k=>{const c=cohorts[k],age=ageOf(k);const row=[k,c.size,age];
  DAYS.forEach(D=>row.push(age<D?'':scale(cumTo(c,D,metric),c.size).toFixed(4)));
  row.push(scale(totRev(c,metric),c.size).toFixed(4));row.push(scale(totRev(c,'iap'),c.size).toFixed(4));
  row.push(scale(totRev(c,'iaa'),c.size).toFixed(4));row.push(scale(c.cost||0,c.size).toFixed(2));
  row.push(c.cost?(totRev(c,'total')/c.cost).toFixed(3):'');lines.push(row.join(','));});
 const blob=new Blob([lines.join('\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='ltv_'+$('camp').value.replace(/[^A-Za-z0-9]+/g,'_')+'_'+metric+'_'+basis+'.csv';a.click();URL.revokeObjectURL(a.href);
}
$('camp').innerHTML=PAYLOAD.campaigns.map(c=>'<option>'+c+'</option>').join('');
$('sub').innerHTML=PAYLOAD.meta.app+' - '+PAYLOAD.meta.window+' - '+PAYLOAD.meta.source+' - generated '+PAYLOAD.meta.generated;
$('caveats').innerHTML='<b>Definitions.</b> LTV = cumulative AppsFlyer-attributed revenue per install (IAP af_purchase + ad_revenue), cohorted by install date. Cost = AppsFlyer daily spend for that campaign/date; ROAS = revenue-to-date / cost. Cohorts are young so values are floors; last ~2-3 days lag in AppsFlyer. Organic has no spend (ROAS blank).';
$('camp').onchange=()=>{populatePCohort();render();};
$('metric').onchange=render;$('basis').onchange=render;$('pcohort').onchange=render;$('dl').onclick=downloadCSV;
populatePCohort();render();
