<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiny Knight Fall - retention by cohort</title>
<style>
 :root{color-scheme:light;--surface-0:#f9f9f7;--surface-1:#fcfcfb;--border:#e4e2dd;
  --text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#898781;
  --series-1:#2a78d6;--accent:#2a78d6;--grid:#e1e0d9;--axis:#c3c2b7;
  --good:#0ca30c;--warning:#fab219;--serious:#ec835a;--critical:#d03b3b;
  --hover:rgba(11,11,11,.05);--ring:rgba(11,11,11,.10);}
 @media(prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
  --surface-0:#0d0d0d;--surface-1:#1a1a19;--border:#33322f;--text-primary:#fff;
  --text-secondary:#c3c2b7;--text-muted:#898781;--series-1:#3987e5;--accent:#3987e5;
  --grid:#2c2c2a;--axis:#383835;--hover:rgba(255,255,255,.06);--ring:rgba(255,255,255,.10);}}
 :root[data-theme="dark"]{color-scheme:dark;
  --surface-0:#0d0d0d;--surface-1:#1a1a19;--border:#33322f;--text-primary:#fff;
  --text-secondary:#c3c2b7;--text-muted:#898781;--series-1:#3987e5;--accent:#3987e5;
  --grid:#2c2c2a;--axis:#383835;--hover:rgba(255,255,255,.06);--ring:rgba(255,255,255,.10);}
 *{box-sizing:border-box;margin:0}
 body{background:var(--surface-0);color:var(--text-primary);padding:20px 22px 40px;
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
 h1{font-size:20px;font-weight:650}
 .sub{color:var(--text-secondary);font-size:12.5px;margin:4px 0 14px}
 .card{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;
  padding:13px 15px 12px;margin-bottom:13px}
 .card h2{font-size:13.5px;font-weight:650;margin-bottom:3px}
 .card .note{font-size:11.5px;color:var(--text-muted);margin-bottom:8px;max-width:1150px}
 .row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
 .row+.row{margin-top:9px}
 .lbl{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:.04em;min-width:74px}
 button,select,input{font:inherit;color:var(--text-primary)}
 .btn{padding:.34rem .6rem;border:1px solid var(--border);border-radius:7px;
  background:var(--surface-1);cursor:pointer;font-size:12.5px}
 .btn:hover{background:var(--hover)}
 .btn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
 select.btn{padding:.34rem .5rem}
 .chip{padding:.24rem .5rem;border:1px solid var(--border);border-radius:6px;
  background:var(--surface-1);cursor:pointer;font-size:12px;font-variant-numeric:tabular-nums}
 .chip:hover{background:var(--hover)}
 .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
 .chip.off{opacity:.45;cursor:not-allowed}
 .ms{position:relative;display:inline-block}
 .ms-pop{position:absolute;z-index:40;top:calc(100% + 4px);left:0;width:264px;
  background:var(--surface-1);border:1px solid var(--border);border-radius:9px;
  box-shadow:0 8px 26px rgba(0,0,0,.16);padding:8px}
 .ms-pop[hidden]{display:none}
 .ms-pop input[type=search]{width:100%;padding:.3rem .45rem;border:1px solid var(--border);
  border-radius:6px;background:var(--surface-0);margin-bottom:6px;font-size:12.5px}
 .ms-acts{display:flex;gap:5px;margin-bottom:6px}
 .ms-acts .btn{font-size:11.5px;padding:.2rem .45rem}
 .ms-list{max-height:246px;overflow:auto}
 .ms-list label{display:flex;align-items:center;gap:7px;padding:.2rem .3rem;border-radius:5px;
  font-size:12.5px;cursor:pointer}
 .ms-list label:hover{background:var(--hover)}
 .ms-list .cnt{margin-left:auto;color:var(--text-muted);font-size:11px;font-variant-numeric:tabular-nums}
 .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:9px;margin-bottom:13px}
 .tile{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
 .tile .v{font-size:21px;font-weight:650;line-height:1.15}
 .tile .l{font-size:11.5px;color:var(--text-secondary);margin-top:2px}
 .tile .n{font-size:10.5px;color:var(--text-muted);margin-top:3px}
 .tile[data-tip]{cursor:help}
 .tile[data-tip]:hover{border-color:var(--accent)}
 .scroll{overflow-x:auto}
 table{border-collapse:separate;border-spacing:2px;font-size:12px}
 th{text-align:right;color:var(--text-secondary);font-weight:600;padding:4px 7px;white-space:nowrap;
  border-bottom:1px solid var(--border)}
 th.d{color:var(--text-primary)}
 td{text-align:right;padding:4px 7px;font-variant-numeric:tabular-nums;white-space:nowrap}
 th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface-1);z-index:2}
 td.heat{border-radius:4px}
 td.dim{color:var(--text-muted)}
 td.na{color:var(--axis)}
 tr.pooled td{border-top:2px solid var(--axis);font-weight:650}
 tr.pooled td:first-child{color:var(--text-primary)}
 .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  padding:.1rem .38rem;border-radius:5px;border:1px solid var(--ring)}
 .tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface-1);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11.5px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:280px;line-height:1.5}
 .tip[hidden]{display:none}
 .tip b{color:var(--text-primary)}.tip .k{color:var(--text-muted)}
 .legend{display:flex;gap:15px;font-size:11.5px;color:var(--text-secondary);margin:2px 0 7px;flex-wrap:wrap}
 .legend span{display:inline-flex;align-items:center;gap:6px}
 svg{display:block;width:100%}
 svg text{font:10.5px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text-secondary)}
 .caveats{font-size:11.5px;color:var(--text-muted);max-width:1150px;line-height:1.6}
 .caveats b{color:var(--text-secondary)}
 .warn{border-left:3px solid var(--warning);padding-left:9px;font-size:12px;
  color:var(--text-secondary);margin-top:8px}
 .empty{font-size:12.5px;color:var(--text-muted);padding:16px 2px}
</style></head><body>

<h1>Retention by install cohort &mdash; Tiny Knight Fall</h1>
<div class="sub" id="sub"></div>

<div class="card">
 <div class="row">
  <span class="lbl">Filter</span>
  <div class="ms" id="ms-country"></div>
  <div class="ms" id="ms-campaign"></div>
  <button class="btn" id="reset">Reset filters</button>
 </div>
 <div class="row">

  <span id="daychips" class="row" style="gap:4px"></span>
 </div>

   <option value="users">Active / cohort n</option>

  <select class="btn" id="heat">
   <option value="col">Heat: per day column</option>
   <option value="global">Heat: one global scale</option>
   <option value="none">Heat: off</option>
  </select>
  <label class="btn" style="display:inline-flex;gap:6px;align-items:center">
   <input type="checkbox" id="collapse"> Collapse cohorts into one pooled row</label>
  <label class="btn" style="display:inline-flex;gap:6px;align-items:center">
   <input type="checkbox" id="hidethin"> Hide cohorts with n &lt; 30</label>
  <label class="ctl" style="gap:5px">Focus day <select class="btn" id="focusday"></select></label>
  <button class="btn" id="dl">Download CSV</button>
 </div>
</div>

<div class="tiles" id="tiles"></div>

<div class="card">
 <h2>Cohort &times; day-since-install</h2>

</div>

</div>

/* ---------- statistics ---------------------------------------------------- */
const Z=1.959964;
function wilson(x,n){                       // score interval for a proportion
 if(!n) return null;
 const p=x/n, d=1+Z*Z/n, c=(p+Z*Z/(2*n))/d,
       h=Z*Math.sqrt(p*(1-p)/n+Z*Z/(4*n*n))/d;
 return {p,n,x,lo:Math.max(0,c-h),hi:Math.min(1,c+h),half:h};
}
/* Grade = how precise the estimate is. Relative margin (margin / rate) is what
   matters for a decision: +/-2pp on 30% is tight, +/-2pp on 3% is meaningless. */
const GRADES=[{k:"High",c:"var(--good)"},{k:"Medium",c:"var(--warning)"},
              {k:"Low",c:"var(--serious)"},{k:"Very low",c:"var(--critical)"}];
function grade(w){
 if(!w||!w.n) return null;
 let i;
 if(w.n<30) i=3;
 else if(w.x===0) i=w.half<=0.01?1:w.half<=0.03?2:3;   // rate 0: judge on absolute width
 else{const rel=w.half/w.p; i=rel<=0.10?0:rel<=0.25?1:rel<=0.50?2:3;}
 return Object.assign({i,rel:w.x?w.half/w.p:null},GRADES[i]);
}
/* n needed to reach a target relative margin at the observed rate */
function nFor(p,relTarget){
 if(!(p>0)) return null;
 return Math.ceil(Z*Z*(1-p)/(relTarget*relTarget*p));
}
function lgamma(x){
 const g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,
  -176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,
  1.5056327351493116e-7];
 if(x<0.5) return Math.log(Math.PI/Math.sin(Math.PI*x))-lgamma(1-x);
 x-=1;let a=c[0];const t=x+g+0.5;
 for(let i=1;i<g+2;i++)a+=c[i]/(x+i);
 return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);
}
function gser(s,x){let sum=1/s,term=1/s;
 for(let k=1;k<500;k++){term*=x/(s+k);sum+=term;if(Math.abs(term)<Math.abs(sum)*1e-15)break;}
 return sum*Math.exp(-x+s*Math.log(x)-lgamma(s));}
function gcf(s,x){const FP=1e-300;let b=x+1-s,c=1/FP,d=1/b,h=d;
 for(let i=1;i<=500;i++){const an=-i*(i-s);b+=2;d=an*d+b;if(Math.abs(d)<FP)d=FP;
  c=b+an/c;if(Math.abs(c)<FP)c=FP;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-15)break;}
 return Math.exp(-x+s*Math.log(x)-lgamma(s))*h;}
function chi2sf(q,df){if(df<=0||q<=0)return 1;const s=df/2,x=q/2;
 return x<s+1?1-gser(s,x):gcf(s,x);}
/* Do the cohorts actually differ, or is the spread just noise? Cochran's Q. */
function heterogeneity(cells){                 // [{x,n}]
 const use=cells.filter(c=>c.n>0);
 const N=use.reduce((s,c)=>s+c.n,0), X=use.reduce((s,c)=>s+c.x,0);
 if(use.length<2||!N||!X||X===N) return null;
 const p=X/N;
 const Q=use.reduce((s,c)=>s+Math.pow(c.x-c.n*p,2)/(c.n*p*(1-p)),0);
 const df=use.length-1;
 return {Q,df,I2:Math.max(0,(Q-df)/Q),pval:chi2sf(Q,df),k:use.length};
}

function ink(hex){                          // readable text on a ramp step
 const c=[1,3,5].map(i=>parseInt(hex.substr(i,2),16)/255)
  .map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));
 const L=0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
 return (L+0.05)/0.05 > 4.5 ? "#0b0b0b" : "#ffffff";

/* ---------- aggregation --------------------------------------------------- */
const ageOf=ci=>Math.round((GA1-dateOf(P.cohorts[ci]))/DAY);
/* day d of cohort ci is only observable if that calendar day is inside the GA4 window */
const observable=(ci,d)=>{const t=dateOf(P.cohorts[ci]).getTime()+d*DAY;
 return t>=GA0.getTime()&&t<=GA1.getTime();};

function aggregate(){
 const okC=r=>sel.country.size===0||sel.country.size===P.countries.length||sel.country.has(r.o);
 const okP=r=>sel.campaign.size===0||sel.campaign.size===P.campaigns.length||sel.campaign.has(r.p);
 const out=P.cohorts.map(()=>({i:0,n:0,a:new Array(MAXD+1).fill(0)}));
 for(const r of P.rows){
  if(!okC(r)||!okP(r))continue;
  const o=out[r.c];o.i+=r.i;o.n+=r.n;
  for(let d=0;d<r.a.length;d++)o.a[d]+=r.a[d];
 }
 return out;
}
const days=()=>[...selDays].sort((a,b)=>a-b);

/* pooled cell across every visible cohort for one day */
function pooled(agg,d,rowsVisible){
 let x=0,n=0,k=0;
 rowsVisible.forEach(ci=>{if(!observable(ci,d)||!agg[ci].n)return;
  x+=agg[ci].a[d];n+=agg[ci].n;k++;});
 return {x,n,k,w:wilson(x,n)};
}
function visibleCohorts(agg){
 return P.cohorts.map((_,ci)=>ci)
  .filter(ci=>agg[ci].i>0)
  .filter(ci=>!$("hidethin").checked||agg[ci].n>=30);
}

  {v:num(totN),l:"Matched to GA4 (the n)",n:totI?(100*totN/totI).toFixed(0)+"% of installs":"-",
   tip:`Denominator|matched installs`
     +`|${num(totN)} of ${num(totI)} installs carry an appsflyer_id in GA4`
     +`|Retention is measured on this subset only`
     +`|True for everyone only if matching is unrelated to coming back — an assumption, not a fact`},
  {v:fp.w?pct(fp.w.p):"-",l:"D"+fd+" retention (pooled)",n:fp.w?num(fp.x)+" of "+num(fp.n):"no data",
   tip:poolTip},
  {v:fp.w?"±"+pp(fp.w.half)+"pp":"-",l:"95% margin at D"+fd,
   n:fp.w?pct(fp.w.lo)+" to "+pct(fp.w.hi):"",
   tip:fp.w?`Margin of error|D${fd}|Wilson 95% half-width on ${num(fp.n)} users`
     +`|Plausible range for the true rate: ${pct(fp.w.lo)} to ${pct(fp.w.hi)}`
     +`|Sampling error only — it cannot fix the ${P.meta.matchRate}% match rate or timezone drift`:""},
  {v:fg?fg.k:"-",l:"Confidence at D"+fd,
   n:fg&&fg.rel!==null?"±"+(100*fg.rel).toFixed(0)+"% of the rate":"n too small",
   tip:fg?`Confidence|D${fd}|Grade ${fg.k}`
     +(fg.rel!==null?` — margin is ±${(100*fg.rel).toFixed(0)}% of the rate itself`:"")
     +`|High ≤10%, Medium ≤25%, Low ≤50%, Very low beyond that or n < 30`
     +(need10?`|For High you would need ~${num(need10)} matched users at this rate;`
       +` for Medium ~${num(need25)}. You have ${num(fp.n)}`:""):""},
 ].map(t=>`<div class="tile"${t.tip?` data-tip="${t.tip.replace(/"/g,"&quot;")}"`:""}>
   <div class="v">${t.v}</div><div class="l">${t.l}</div><div class="n">${t.n}</div></div>`).join("");

 /* grid */
 if(!D.length){$("grid").innerHTML='<div class="empty">Pick at least one day column.</div>';}
 else if(!vis.length){$("grid").innerHTML='<div class="empty">No installs match these filters.</div>';}
 else{
  /* heat scale */
  let colMax={},gMax=0;
  D.forEach(d=>{let m=0;vis.forEach(ci=>{const w=cell(agg,ci,d);if(w)m=Math.max(m,w.p);});
   colMax[d]=m;gMax=Math.max(gMax,m);});
  const scaleOf=(d,v)=>{const m=heatMode==="global"?gMax:colMax[d];
   return m>0?Math.min(R.length-1,Math.floor(v/m*R.length)):0;};

  const head=`<tr><th>cohort</th><th>installs</th><th>n (matched)</th><th>observed to</th>`
   +D.map(d=>`<th class="d">D${d}</th>`).join("")+`</tr>`;
  const bodyRows=collapsed?[]:vis.map(ci=>{
   const a=agg[ci];
   return `<tr>`
    +`<td>${P.cohorts[ci].slice(5)}</td><td class="dim">${num(a.i)}</td>`
    +`<td>${num(a.n)}</td><td class="dim">D${Math.min(ageOf(ci),MAXD)}</td>`
    +D.map(d=>cellHTML(agg,ci,d,mode,heatMode,scaleOf,R)).join("")+`</tr>`;
  });
  const pRow=`<tr class="pooled"><td>All ${vis.length} cohorts</td>`
   +`<td class="dim">${num(totI)}</td><td>${num(totN)}</td><td class="dim">pooled</td>`
   +D.map(d=>{const p=pooled(agg,d,vis);
     return cellRender(p.w,d,mode,heatMode,scaleOf,R,`pooled over ${p.k} cohorts`);}).join("")+`</tr>`;
  $("grid").innerHTML=`<table>${head}${bodyRows.join("")}${pRow}</table>`;
 }
 $("gridnote").innerHTML=
  `Rows are install-date cohorts; each column is a day since install (D1 = the day after install). `
  +`A cell is the share of that cohort's <b>matched</b> users seen active in GA4 on that day. `
  +`Blank = outside the GA4 window (${P.meta.gaWindow}), so it is not observable yet. `
  +(heatMode==="col"?`Colour is scaled <b>within each day column</b>, so it compares cohorts to each other, not D1 to D30.`
    :heatMode==="global"?`Colour uses <b>one scale across the whole grid</b>, so later days look pale by construction.`
    :`Colour off.`);


 renderCurve(agg,vis);
}

const cell=(agg,ci,d)=>observable(ci,d)&&agg[ci].n?wilson(agg[ci].a[d],agg[ci].n):null;
function cellHTML(agg,ci,d,mode,heatMode,scaleOf,R){
 if(!observable(ci,d)) return `<td class="na" title="not observable yet">&nbsp;</td>`;
 return cellRender(cell(agg,ci,d),d,mode,heatMode,scaleOf,R,"cohort "+P.cohorts[ci]);
}
function cellRender(w,d,mode,heatMode,scaleOf,R,ctx){
 if(!w) return `<td class="na">&ndash;</td>`;
 const g=grade(w);
 let txt,bg="",fg="";
 if(mode==="conf"){txt=`<span class="badge" style="color:${g.c}">${g.k}</span>`;}
 else{
  if(mode==="rate") txt=pct(w.p);
  else if(mode==="ci") txt=pct(w.p)+" ±"+pp(w.half);
  else if(mode==="band") txt=pct(w.lo)+"–"+pct(w.hi);
  else txt=num(w.x)+" / "+num(w.n);
  if(heatMode!=="none"&&mode!=="users"){
   const c=R[scaleOf(d,w.p)];bg=`background:${c};`;fg=`color:${ink(c)};`;
  }
 }
 const tip=[ctx,`D${d}`,`rate ${pct(w.p)}`,`${num(w.x)} active of ${num(w.n)}`,
  `95% CI ${pct(w.lo)} to ${pct(w.hi)}`,`margin ±${pp(w.half)}pp`,
  `confidence ${g.k}`+(g.rel!==null?` (±${(100*g.rel).toFixed(0)}% of the rate)`:"")].join("|");
 return `<td class="heat" style="${bg}${fg}" data-tip="${tip}">${txt}</td>`;
}

function focusDay(D){
 const v=+$("focusday").value;
 return D.includes(v)?v:(D.includes(1)?1:D[0]!==undefined?D[0]:1);
}

function renderCurve(agg,vis){
 const box=$("curve");box.innerHTML="";
 const pts=[];
 for(let d=0;d<=MAXD;d++){
  const p=pooled(agg,d,vis);
  if(p.w&&p.n) pts.push({d,...p.w});
 }
 if(pts.length<2){box.innerHTML='<div class="empty">Not enough observable days to draw a curve.</div>';
  $("curvenote").textContent="";$("curvelegend").innerHTML="";return;}
 const W=980,H=290,M={l:46,r:18,t:14,b:26};
 const maxY=Math.min(1,Math.max(...pts.map(p=>p.hi))*1.08)||1;   // a proportion never exceeds 100%
 const X=d=>M.l+d/MAXD*(W-M.l-M.r), Y=v=>M.t+(H-M.t-M.b)*(1-v/maxY);
 const NS="http://www.w3.org/2000/svg";
 const el=(t,a,par)=>{const e=document.createElementNS(NS,t);
  for(const k in a)e.setAttribute(k,a[k]);(par||svg).appendChild(e);return e;};
 const svg=document.createElementNS(NS,"svg");
 svg.setAttribute("viewBox",`0 0 ${W} ${H}`);box.appendChild(svg);
 for(let t=0;t<=4;t++){const v=maxY*t/4,y=Y(v);
  el("line",{x1:M.l,x2:W-M.r,y1:y,y2:y,stroke:"var(--grid)"});
  el("text",{x:M.l-6,y:y+3,"text-anchor":"end"}).textContent=(100*v).toFixed(0)+"%";}
 el("line",{x1:M.l,x2:W-M.r,y1:Y(0),y2:Y(0),stroke:"var(--axis)"});
 for(let d=0;d<=MAXD;d+=Math.max(1,Math.round(MAXD/15)))
  el("text",{x:X(d),y:H-7,"text-anchor":"middle"}).textContent="D"+d;
 /* per-cohort faint lines: the spread the pooled interval does NOT describe */
 if(!$("collapse").checked&&vis.length>1) vis.forEach(ci=>{
  let p="";for(let d=0;d<=MAXD;d++){if(!observable(ci,d)||!agg[ci].n)continue;
   const v=agg[ci].a[d]/agg[ci].n;p+=(p?"L":"M")+X(d)+","+Y(v);}
  if(p) el("path",{d:p,fill:"none",stroke:"var(--text-muted)","stroke-width":1,opacity:.28});});
 /* CI band */
 let up="",dn="";
 pts.forEach((p,i)=>up+=(i?"L":"M")+X(p.d)+","+Y(p.hi));
 [...pts].reverse().forEach(p=>dn+="L"+X(p.d)+","+Y(p.lo));
 el("path",{d:up+dn+"Z",fill:"var(--series-1)",opacity:.16,stroke:"none"});
 let line="";pts.forEach((p,i)=>line+=(i?"L":"M")+X(p.d)+","+Y(p.p));
 el("path",{d:line,fill:"none",stroke:"var(--series-1)","stroke-width":2});
 pts.forEach(p=>{el("circle",{cx:X(p.d),cy:Y(p.p),r:3.4,fill:"var(--series-1)",
   stroke:"var(--surface-1)","stroke-width":2,
   "data-tip":`pooled|D${p.d}|rate ${pct(p.p)}|${num(p.x)} active of ${num(p.n)}|`
    +`95% CI ${pct(p.lo)} to ${pct(p.hi)}|margin ±${pp(p.half)}pp`});});
 [1,7,14,30].forEach(d=>{const p=pts.find(q=>q.d===d);if(!p)return;
  el("text",{x:X(d),y:Y(p.p)-9,"text-anchor":"middle",fill:"var(--text-primary)"})
   .textContent="D"+d+" "+pct(p.p);});
 $("curvelegend").innerHTML=
  `<span><span style="width:14px;height:2px;background:var(--series-1);display:inline-block"></span>
   pooled retention</span>
   <span><span style="width:14px;height:9px;background:var(--series-1);opacity:.16;display:inline-block"></span>
   95% confidence interval</span>`
  +(!$("collapse").checked&&vis.length>1
   ?`<span><span style="width:14px;height:1px;background:var(--text-muted);opacity:.5;display:inline-block"></span>
     individual cohorts</span>`:"");
 $("curvenote").innerHTML=`x-axis: days since install (D0 = install day). y-axis: share of matched `
  +`users active that day. The band is the 95% Wilson interval on the pooled rate &mdash; it narrows `
  +`where more cohorts have reached that day. Where the thin cohort lines fan out wider than the `
  +`band, the difference between cohorts is real, not sampling noise.`;
}

/* ---------- tooltip, chips, wiring --------------------------------------- */
const tip=$("tip");
document.addEventListener("mousemove",e=>{
 const t=e.target.closest?.("[data-tip]");
 if(!t){tip.hidden=true;return;}
 const parts=t.dataset.tip.split("|");
 tip.innerHTML=`<b>${parts[0]} &middot; ${parts[1]}</b><br>`+parts.slice(2).join("<br>");
 tip.hidden=false;
 const r=tip.getBoundingClientRect();
 tip.style.left=Math.min(e.clientX+14,innerWidth-r.width-8)+"px";
 tip.style.top=Math.min(e.clientY+16,innerHeight-r.height-8)+"px";
});

function paintChips(){
 $("daychips").innerHTML=Array.from({length:MAXD+1},(_,d)=>d)
  .map(d=>`<button class="chip${selDays.has(d)?" on":""}" data-d="${d}">D${d}</button>`).join("");
}
$("daychips").onclick=e=>{const d=e.target.dataset.d;if(d===undefined)return;
 const n=+d;selDays.has(n)?selDays.delete(n):selDays.add(n);paintChips();syncFocus();render();};
document.querySelectorAll("[data-days]").forEach(b=>b.onclick=()=>{
 const v=b.dataset.days;
 selDays=v==="all"?new Set(Array.from({length:MAXD+1},(_,d)=>d))
  :new Set(v.split(",").map(Number).filter(d=>d<=MAXD));
 paintChips();syncFocus();render();});

function syncFocus(){
 const D=days(),cur=+$("focusday").value;
 $("focusday").innerHTML=D.map(d=>`<option value="${d}">D${d}</option>`).join("")
  ||`<option value="1">D1</option>`;
 $("focusday").value=D.includes(cur)?cur:(D.includes(1)?1:D[0]??1);
}
function downloadCSV(){
 const agg=aggregate(),D=days(),vis=visibleCohorts(agg);
 const f=s=>s.size===0||s.size===(s===sel.country?P.countries.length:P.campaigns.length);
 const head=["cohort","installs","matched_n"];
 D.forEach(d=>head.push(`D${d}_active`,`D${d}_rate`,`D${d}_lo`,`D${d}_hi`,`D${d}_margin_pp`,`D${d}_confidence`));
 const line=(name,i,n,get)=>{const r=[name,i,n];
  D.forEach(d=>{const w=get(d);
   r.push(w?w.x:"",w?(100*w.p).toFixed(3):"",w?(100*w.lo).toFixed(3):"",
    w?(100*w.hi).toFixed(3):"",w?(100*w.half).toFixed(3):"",w?grade(w).k:"");});
  return r.join(",");};
 const rows=vis.map(ci=>line(P.cohorts[ci],agg[ci].i,agg[ci].n,d=>cell(agg,ci,d)));
 const tI=vis.reduce((s,ci)=>s+agg[ci].i,0),tN=vis.reduce((s,ci)=>s+agg[ci].n,0);
 rows.push(line("POOLED",tI,tN,d=>pooled(agg,d,vis).w));
 const meta=`# Tiny Knight Fall retention | generated ${P.meta.generated}`
  +` | countries=${f(sel.country)?"All":[...sel.country].map(i=>P.countries[i]).join(" ")}`
  +` | campaigns=${f(sel.campaign)?"All":[...sel.campaign].map(i=>P.campaigns[i]).join(" ")}`
  +` | denominator=installs matched to GA4 by appsflyer_id`;
 const blob=new Blob([[meta,head.join(","),...rows].join("\n")],{type:"text/csv"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download="retention_cohorts.csv";a.click();URL.revokeObjectURL(a.href);
}

document.addEventListener("click",()=>document.querySelectorAll(".ms-pop").forEach(p=>p.hidden=true));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);
["mode","heat","collapse","hidethin","focusday"].forEach(id=>$(id).onchange=render);
$("dl").onclick=downloadCSV;
$("reset").onclick=()=>{sel.country.clear();sel.campaign.clear();msC.label();msC.paint();
 msP.label();msP.paint();render();};

const msC=multiselect($("ms-country"),"Country",P.countries,P.countryInstalls,sel.country);
const msP=multiselect($("ms-campaign"),"Campaign",P.campaigns,P.campaignInstalls,sel.campaign);
$("sub").innerHTML=`${P.meta.app} &middot; installs ${P.meta.installWindow} &middot; `
 +`GA4 activity ${P.meta.gaWindow} &middot; generated ${P.meta.generated}`;
$("caveats").innerHTML=`
 <b>Cohort.</b> Install date from AppsFlyer (<i>Install Time</i>, app timezone), paid + organic.
 One row per device; a device seen twice keeps its first install
 (${num(P.meta.dupInstalls)} duplicates collapsed).<br>
 <b>Retained on day N.</b> The user fired <i>any</i> GA4 event on the calendar day N days after
 their install date. This is day-N return, not N-day rolling retention, and it is not
 de-duplicated against a session definition.<br>
 <b>The denominator is the catch.</b> n counts installs that could be <b>matched to GA4 by
 <code>appsflyer_id</code></b> &mdash; ${num(P.meta.matched)} of ${num(P.meta.installs)} installs
 (${P.meta.matchRate}%). Users whose GA4 events never carried the property are invisible here.
 Retention is measured on that matched subset; it is only the true rate if matching is unrelated
 to whether someone comes back, which is an assumption, not a fact.<br>
 <b>Confidence intervals cover sampling error only.</b> They say how much the number would move
 if you drew another sample of the same size. They say nothing about the match-rate bias above,
 about AppsFlyer/GA4 timezone drift (install time is app-local, GA4 <code>event_date</code> is the
 export's), or about attribution error.<br>
 <b>D0 is close to 100% by construction</b> &mdash; a user only enters the denominator by having
 GA4 events that carry their <code>appsflyer_id</code>, and most fire on install day. The gap
 (D0 is 93%, not 100%) is mostly timezone drift between the AppsFlyer install date and the GA4
 export date, which is a useful sanity check on the join but means D0 carries no retention signal.
 Read D1 onward.<br>
 <b>Blank cells are not zeros.</b> A day is only shown when it falls inside the GA4 window
 (${P.meta.gaWindow}); everything past a cohort's last observable day is left blank.
 The GA4 source is <code>events_intraday_*</code>, so history is limited and the last day or two
 can still be filling in. Installs are AppsFlyer-attributed and lag ~1&ndash;3 days.<br>
 <b>Grades.</b> Margin is the Wilson 95% half-width. High = margin within 10% of the rate,
 Medium 25%, Low 50%, Very low beyond that or n &lt; 30.`;
paintChips();syncFocus();render();
</script></body></html>
